apiVersion: v1
kind: Secret
metadata:
  name: green-cloud-secrets
type: Opaque
# IMPORTANT: Replace these placeholder values with your real base64-encoded secrets
# before applying to a cluster. Never commit real credentials to source control.
#
# Generate values:
#   echo -n 'your-strong-jwt-secret' | base64
#   echo -n 'your-electricity-maps-api-key' | base64
#   echo -n 'your-vault-token' | base64
data:
  JWT_SECRET: REPLACE_WITH_BASE64_ENCODED_JWT_SECRET
  ELECTRICITY_MAPS_API_KEY: REPLACE_WITH_BASE64_ENCODED_API_KEY
  VAULT_TOKEN: REPLACE_WITH_BASE64_ENCODED_VAULT_TOKEN
